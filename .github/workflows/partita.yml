name: Partita (intervallo e fine)
# Ogni 15 minuti: lo script esce subito se non c'e' una partita della Fiorentina in corso.
# Quando trova una partita in corso resta attivo e controlla ogni 2 minuti fino al fischio finale.
# Durante una partita salva le statistiche all'intervallo e a fine gara.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto | intervallo | fine'
        default: 'auto'
        required: false
permissions:
  contents: write
concurrency:
  group: viola-dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Segui la partita (controllo ogni 2 minuti fino alla fine)
        run: bash scripts/segui.sh "${{ github.event.inputs.modo || 'auto' }}"
